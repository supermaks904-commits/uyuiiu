                <div style="color:#334155">${e(c.text)}</div>
              </div>
            `).join('')}
          </div>

          <div style="display:flex;gap:8px;margin-top:10px">
            <input type="text" class="c-input" id="cinput_${p.id}" placeholder="Написать комментарий в обсуждение..." style="flex:1;padding:6px 12px;font-size:13px;border-radius:8px;border:1px solid var(--line)"/>
            <button class="btn sm tg-send-comment-btn" data-pid="${p.id}" style="background:var(--green);color:#fff;font-weight:700">
              Отправить
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function attachPostEvents() {
    // Клики по реакциям
    document.querySelectorAll('.tg-react-pill').forEach(btn => {
      btn.onclick = async () => {
        const bar = btn.closest('.tg-reactions-bar');
        const postId = bar.dataset.pid;
        const emoji = btn.dataset.emoji;
        try {
          const res = await api('/insider/reaction', { postId, reaction: emoji });
          const cntEl = btn.querySelector('.cnt');
          if (cntEl && res.reactions && res.reactions[emoji]) {
            cntEl.textContent = res.reactions[emoji];
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => btn.style.transform = '', 200);
          }
        } catch (e) {}
      };
    });

    // Добавить эмодзи-реакцию
    document.querySelectorAll('.tg-add-react-btn').forEach(btn => {
      btn.onclick = () => {
        const postId = btn.dataset.pid;
        modal(`
          <div style="padding:14px;text-align:center">
            <h3 style="margin:0 0 12px">Выберите реакцию</h3>
            <div style="display:flex;gap:12px;justify-content:center;font-size:26px;cursor:pointer">
              ${['🔥', '🤡', '❤️', '👍', '🤬', '🍿', '🤯', '👏', '🏆', '💩'].map(em => `
                <span class="emoji-pick-item" style="transition:transform .15s" onclick="triggerPickReaction('${postId}', '${em}')">${em}</span>
              `).join('')}
            </div>
          </div>
        `);
      };
    });

    // Тоггл комментариев
    document.querySelectorAll('.tg-toggle-comments').forEach(btn => {
      btn.onclick = () => {
        const pid = btn.dataset.pid;
        const cBox = $(`#comments_${pid}`);
        if (cBox) {
          cBox.style.display = cBox.style.display === 'none' ? 'block' : 'none';
        }
      };
    });

    // Отправка комментария
    document.querySelectorAll('.tg-send-comment-btn').forEach(btn => {
      btn.onclick = async () => {
        const pid = btn.dataset.pid;
        const inp = $(`#cinput_${pid}`);
        const text = inp ? inp.value.trim() : '';
        if (!text) return toast('Введите текст комментария');

        try {
          const res = await api('/insider/comment', { postId: pid, text });
          inp.value = '';
          const list = $(`#clist_${pid}`);
          if (list && res.comment) {
            const newItem = document.createElement('div');
            newItem.className = 'tg-comment-item';
            newItem.innerHTML = `
              <div class="tg-comment-author">
                <span>${e(res.comment.author)}</span>
                ${res.comment.clubBadge ? `<span class="tag" style="font-size:10px;padding:1px 6px">${e(res.comment.clubBadge)}</span>` : ''}
                <span class="muted small" style="margin-left:auto;font-weight:normal">только что</span>
              </div>
              <div style="color:#334155">${e(res.comment.text)}</div>
            `;
            list.appendChild(newItem);
            toast('Комментарий добавлен!');
          }
        } catch (err) {
          toast(err.message, true);
        }
      };
    });
  }

  window.triggerPickReaction = async (postId, emoji) => {
    try {
      const res = await api('/insider/reaction', { postId, reaction: emoji });

              <option value="karp">💣 Иван Карп | Инсайды от Карпа (@karpinside)</option>
              <option value="nobel">🍷 Nobel | Нобель Арустамян (@nobel_arustamyan)</option>

            </select>

            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
              ${[

          </div>

          <div class="row" style="justify-content:flex-end;gap:10px;margin-top:6px">
            <button class="btn alt" onclick="document.querySelector('#modal').remove()">Отмена</button>
            <button class="btn" id="btn_run_ai_gen" style="background:linear-gradient(135deg, #8b5cf6, #6366f1);color:#fff;font-weight:700">
              🚀 Сгенерировать инсайд
            </button>
          </div>
        </div>
      </div>
    `);

    $('#btn_run_ai_gen').onclick = async () => {
      const channelId = $('#ai_ch_select').value;
      const customPrompt = $('#ai_prompt_input').value.trim();

        btn.disabled = false;
        btn.textContent = '🚀 Сгенерировать инсайд';

  });

  // Модалка ручного создания
  $('#btn_insider_manual')?.addEventListener('click', () => {
    modal(`
      <div style="max-width:540px;width:100%;padding:10px">

        <div style="display:flex;flex-direction:column;gap:12px">
          <div>

  let allCases = [];

  async function loadEskCases() {
    const listEl = $('#esk_cases_list');
    if (!listEl) return;
    try {
      allCases = await api('/esk/cases');
      
      const pendingCount = allCases.filter(c => c.status === 'pending').length;
      const errorCount = allCases.filter(c => c.status === 'decided' && c.hearing?.finalVerdict === 'incorrect').length;
      const correctCount = allCases.filter(c => c.status === 'decided' && c.hearing?.finalVerdict === 'correct').length;

      $('#esk_kpi_total') && ($('#esk_kpi_total').textContent = allCases.length);
      $('#esk_kpi_pending') && ($('#esk_kpi_pending').textContent = pendingCount);
      $('#esk_kpi_errors') && ($('#esk_kpi_errors').textContent = errorCount);
      $('#esk_kpi_correct') && ($('#esk_kpi_correct').textContent = correctCount);

      let filtered = allCases;
      if (ESK_FILTER_STATUS !== 'all') {
        filtered = allCases.filter(c => c.status === ESK_FILTER_STATUS);
      }

      if (!filtered.length) {
        listEl.innerHTML = `
          <div class="panel" style="text-align:center;padding:30px">
            <div style="font-size:36px;margin-bottom:8px">⚖️</div>
            <h3>Дел в этой категории нет</h3>
            <p class="muted small">Клубы не подавали претензий, либо все спорные эпизоды уже рассмотрены комиссией.</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(renderEskCaseCard).join('');
      attachCaseEvents();

      if (selectedCaseId) {
        const found = allCases.find(c => c.id === selectedCaseId);
        if (found) openHearingModal(found);
      }
    } catch (e) {
      listEl.innerHTML = `<div class="warn">Ошибка загрузки дел ЭСК: ${e.message}</div>`;
    }
  }

    document.querySelectorAll('.esk-open-hearing-btn').forEach(btn => {

        const cid = btn.dataset.cid;
        const found = allCases.find(c => c.id === cid);
        if (found) openHearingModal(found);
      };
    });
  }

        toast('Ошибка утверждения: ' + err.message, true);
      }
    };
  }

  // Фильтрация по статусам
  document.querySelectorAll('.esk-tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.esk-tab-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      ESK_FILTER_STATUS = btn.dataset.st;
      loadEskCases();
    };
  });

  // Модалка подачи новой жалобы в ЭСК
  $('#btn_new_esk_complaint')?.addEventListener('click', async () => {
    let finishedFixtures = [];
    try {
      finishedFixtures = (await api('/fixtures?comp=rpl')).filter(f => f.status === 'done');
    } catch (e) {}

    modal(`
      <div style="max-width:540px;width:100%;padding:10px">
        <div class="row sp" style="margin-bottom:12px">
          <h3 style="margin:0">📝 Подача официального обращения в ЭСК РФС</h3>
          <button class="btn alt sm" onclick="document.querySelector('#modal').remove()">✕</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px">
          <div>
            <label class="small" style="font-weight:700">1. Выберите сыгранный матч:</label>
            <select id="esk_new_match" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);margin-top:4px">
              ${finishedFixtures.slice(-15).reverse().map(f => `
                <option value="${f.id}">«${e(f.homeName || f.home)}» ${f.hg}:${f.ag} «${e(f.awayName || f.away)}» (${e(f.date)})</option>
              `).join('')}
            </select>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div>
              <label class="small" style="font-weight:700">2. Клуб-заявитель:</label>
              <input type="text" id="esk_new_applicant" value="${e(S.me?.teamName || 'Спартак')}" placeholder="Название клуба" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);margin-top:4px"/>
            </div>
            <div>
              <label class="small" style="font-weight:700">3. Минута эпизода:</label>
              <input type="text" id="esk_new_minute" value="78" placeholder="например 78" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);margin-top:4px"/>
            </div>
          </div>

          <div>
            <label class="small" style="font-weight:700">4. Тип спорного эпизода:</label>
            <select id="esk_new_type" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);margin-top:4px">
              <option value="penalty">Назначение / неназначение 11-метрового удара (Пенальти)</option>
              <option value="red_card">Прямое удаление с поля (Красная карточка)</option>
              <option value="disallowed_goal">Отмена взятия ворот / вмешательство VAR</option>
              <option value="handball">Игра рукой в штрафной площади</option>
              <option value="offside">Фиксация положения «вне игры»</option>
            </select>
          </div>

          <div>
            <label class="small" style="font-weight:700">5. Аргументация и суть претензии:</label>
            <textarea id="esk_new_text" rows="3" placeholder="Опишите, в чем заключалась ошибка арбитра (отсутствие контакта, игра в мяч, неверные офсайдные линии)..." style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);margin-top:4px;font-family:inherit"></textarea>
          </div>

          <div class="row" style="justify-content:flex-end;gap:10px">
            <button class="btn alt" onclick="document.querySelector('#modal').remove()">Отмена</button>
            <button class="btn" id="btn_send_esk_complaint" style="background:#b45309;color:#fff;font-weight:800">
              Направить в комиссию
            </button>
          </div>
        </div>
      </div>
    `);

    $('#btn_send_esk_complaint').onclick = async () => {
      const matchId = $('#esk_new_match').value;
      const applicantClub = $('#esk_new_applicant').value.trim();
      const minute = $('#esk_new_minute').value.trim();
      const episodeType = $('#esk_new_type').value;
      const complaint = $('#esk_new_text').value.trim();

      if (!applicantClub || !complaint) return toast('Заполните название клуба и суть претензии');

      try {
        await api('/esk/create-complaint', {
          matchId,
          applicantClub,
          minute,
          episodeType,
          complaint
        });

        document.querySelector('#modal')?.remove();
        toast('📋 Обращение зарегистрировано в ЭСК РФС!');
        loadEskCases();
      } catch (err) {
        toast('Ошибка: ' + err.message, true);
      }
    };
  });

  loadEskCases();
}

/* Вкладка ЭСК РФС внутри окна матча */
async function renderMatchEskTab(container, f, M) {
  try {
    const allCases = await api('/esk/cases');
    const matchCases = allCases.filter(c => c.matchId === f.id);

    if (!matchCases.length) {
      container.innerHTML = `
        <div class="panel" style="text-align:center;padding:24px">
          <div style="font-size:32px;margin-bottom:6px">⚖️</div>
          <h3 style="margin:0 0 6px">По этому матчу обращений в ЭСК РФС нет</h3>
          <p class="muted small" style="margin:0 0 14px">Считаете, что судейская бригада ошиблась в ключевом эпизоде встречи?</p>
          <button class="btn" id="btn_match_file_esk" style="background:#b45309;color:#fff;font-weight:700">
            📝 Подать жалобу в ЭСК РФС по этому матчу
          </button>
        </div>
      `;
      $('#btn_match_file_esk')?.addEventListener('click', () => {
        location.hash = '#/esk';
      });
      return;
    }

    container.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="row sp" style="align-items:center">
          <h3 style="margin:0">⚖️ Дела ЭСК РФС по этому матчу (${matchCases.length})</h3>
          <a href="#/esk" class="btn alt sm">Все заседания ЭСК РФС →</a>
        </div>
        ${matchCases.map(c => `
          <div class="panel" style="border-left:4px solid ${c.status === 'pending' ? '#f59e0b' : (c.hearing?.finalVerdict === 'incorrect' ? '#dc2626' : '#16a34a')}">
            <div class="row sp" style="margin-bottom:6px">
              <b>${e(c.protocolNum)} · ${e(c.minute)} · ${e(c.episodeTitle)}</b>
              <span class="tag">${c.status === 'pending' ? '⏳ На рассмотрении' : '✅ Вердикт вынесен'}</span>
            </div>
            <p class="small" style="margin:0 0 8px;color:#334155"><b>Претензия ФК «${e(c.applicantClub)}»:</b> ${e(c.applicantComplaint)}</p>
            ${c.hearing?.verdictSummary ? `<div style="background:#f8fafc;padding:8px 10px;border-radius:6px;font-size:13px;color:#0f172a"><b>Вердикт:</b> ${e(c.hearing.verdictSummary)}</div>` : ''}
            <div style="margin-top:10px">
              <a href="#/esk" class="btn sm" style="background:#1b5c3f;color:#fff">Перейти к заседанию и протоколу →</a>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } catch (e) {
    container.innerHTML = `<div class="warn">Ошибка загрузки данных ЭСК: ${e.message}</div>`;
  }
}

/* Вкладка Инсайдов внутри окна матча */
async function renderMatchInsiderTab(container, f, M) {
  try {
    const allPosts = await api('/insider/posts');
    const HName = f.homeName || f.home;
    const AName = f.awayName || f.away;
    const matchPosts = allPosts.filter(p =>
      p.relatedFixtureId === f.id ||
      (p.content || '').includes(HName) ||
      (p.content || '').includes(AName)
    );

    if (!matchPosts.length) {
      container.innerHTML = `
        <div class="panel" style="text-align:center;padding:24px">
          <div style="font-size:32px;margin-bottom:6px">📰</div>
          <h3 style="margin:0 0 6px">Инсайдов по этому матчу пока не выходило</h3>
          <p class="muted small" style="margin:0 0 14px">Хотите получить эксклюзивный вброс от Карпа или Нобеля по этому поединку?</p>
          <a href="#/insider" class="btn" style="background:#ea580c;color:#fff;font-weight:700">
            Перейти в общую Telegram-ленту инсайдов →
          </a>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="row sp" style="align-items:center">
          <h3 style="margin:0">📰 Инсайды по матчу (${matchPosts.length})</h3>
          <a href="#/insider" class="btn alt sm">Все инсайды РПЛ →</a>
        </div>
        ${matchPosts.slice(0, 5).map(p => `
          <div class="panel" style="border-left:4px solid #ea580c">
            <div class="row sp" style="margin-bottom:6px">
              <b>${e(p.channelName)}</b>
              <span class="muted small">${e(p.timeLabel || 'недавно')}</span>

    container.innerHTML = `<div class="warn">Ошибка загрузки инсайдов: ${e.message}</div>`;
  }
}

boot();

// Реальный трекинг присутствия зрителей онлайн (heartbeat к /api/presence/ping)
(function initRealPresenceTracker() {
  let clientId = null;
  try {
    clientId = localStorage.getItem('rpl_presence_client_id');
    if (!clientId) {
      clientId = 'cl_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
      localStorage.setItem('rpl_presence_client_id', clientId);
    }
  } catch (e) {
    clientId = 'cl_temp_' + Math.random().toString(36).substring(2, 8);
  }

  async function pingPresence() {
    try {
      const isWatching = location.hash.startsWith('#/draw');
      const payload = {
        clientId,
        page: location.hash || '/',
        watchingDraw: isWatching,
        teamName: window.S?.me?.teamName || '',
        role: window.S?.me?.role || 'visitor'
      };

      const res = await api('/presence/ping', payload);
      if (res && res.drawViewers !== undefined) {
        if (typeof DRAW_CTX !== 'undefined') {
          DRAW_CTX.viewers = res.drawViewers;
          if (res.peakViewers) DRAW_CTX.peakViewers = res.peakViewers;
          if (typeof updateDrawViewersDisplay === 'function') {
            updateDrawViewersDisplay();
          }
        }
      }
    } catch (e) {
      // Игнорируем фоновые задержки пинга
    }
  }

  setTimeout(pingPresence, 300);
  setInterval(pingPresence, 3500);
  window.addEventListener('hashchange', () => setTimeout(pingPresence, 150));
})();
</script>

/* прячем подсказку «прокручивайте таблицу», если таблица и так помещается */
(function(){
  function upd(){
    document.querySelectorAll('.wrap').forEach(function(w){
      var fits = w.scrollWidth <= w.clientWidth + 1;
      w.classList.toggle('no-scroll', fits);
      var h = w.previousElementSibling;
      if (h && h.classList && h.classList.contains('scroll-hint')) h.classList.toggle('off', fits);
    });
  }
  var t; function later(){ clearTimeout(t); t = setTimeout(upd, 120); }
  window.addEventListener('resize', later);
  window.addEventListener('load', later);
  new MutationObserver(later).observe(document.documentElement, {childList:true, subtree:true});
})();
</script>
