async function pgLogin(app) {
  app.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center;padding:20px 12px';

  const card = document.createElement('form');
  card.style.cssText = 'max-width:440px;width:100%;background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 16px 40px rgba(15,35,24,0.12);border:1px solid rgba(25,118,62,0.15)';

  const currentWho = S.me ? (S.me.role === 'admin' ? 'Администратор' : (S.me.teamName || teamName(S.me.teamId) || 'Клуб')) : null;

  const head = document.createElement('div');
  head.style.cssText = 'text-align:center;margin-bottom:20px';
  head.innerHTML = `<div style="display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#065f46;font-weight:700;font-size:12px;letter-spacing:0.08em;padding:5px 12px;border-radius:999px;margin-bottom:12px">⚽ ВИРТ РПЛ</div>
    <h1 style="margin:0 0 6px;font-size:24px;font-weight:700;color:#0f172a">Вход в систему</h1>
    <p class="muted small" style="margin:0">Введите персональный код клуба или администратора</p>
    ${currentWho ? `
      <div style="margin-top:14px;background:#f0fdf4;border:1px solid #bbf7d0;padding:10px 14px;border-radius:10px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div>
          <div class="small muted" style="font-size:11.5px">Текущая сессия:</div>
          <div style="font-weight:700;color:#166534;font-size:14px">🟢 ${e(currentWho)}</div>
        </div>
        <button type="button" id="login_reset_btn" class="btn alt sm" style="font-size:12px;padding:4px 10px">Сменить / Выйти</button>
      </div>
    ` : ''}`;

  const lbl = document.createElement('label');
  lbl.htmlFor = 'code';
  lbl.textContent = 'Код доступа';
  lbl.style.cssText = 'display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px';

  const inp = document.createElement('input');
  inp.id = 'code';
  inp.name = 'code';
  inp.type = 'text';
  inp.placeholder = 'XXXX-XXXX';
  inp.autocomplete = 'off';
  inp.style.cssText = 'display:block;width:100%;font-family:ui-monospace,Consolas,monospace;font-size:18px;letter-spacing:0.14em;text-align:center;padding:12px 14px;border-radius:10px;border:1.5px solid #cbd5e1;background:#f8fafc;color:#0f172a;caret-color:#1b5c3f';

  const btn = document.createElement('button');
  btn.id = 'go';
  btn.type = 'submit';
  btn.className = 'btn';
  btn.textContent = 'Войти в клуб';
  btn.style.cssText = 'width:100%;margin-top:16px;padding:12px 16px;font-size:15px;font-weight:600;border-radius:10px;justify-content:center;text-align:center';

  const foot = document.createElement('p');
  foot.className = 'muted small';
  foot.textContent = 'Код доступа выдаётся администратором лиги. При вводе другого кода сессия переключается на выбранный клуб.';
  foot.style.cssText = 'text-align:center;margin:16px 0 0;font-size:12px';

  card.append(head, lbl, inp, btn, foot);
  wrap.appendChild(card);
  app.appendChild(wrap);

  const resetBtn = card.querySelector('#login_reset_btn');
  if (resetBtn) {
    resetBtn.onclick = async () => {
      const oldTok = S.tok;
      S.tok = '';
      S.code = '';
      S.me = null;
      if (S.st) S.st.me = null;
      CLUB_TID = '';
      try {
        localStorage.removeItem('tok');
        localStorage.removeItem('rpl_auth_code');
        localStorage.removeItem('rpl_club_tid');
      } catch (e) {}
      drawChrome();
      if (oldTok) {
        try {
          await fetch('/api/logout', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-token': oldTok },
            body: '{}'
          });
        } catch (e) {}
      }
      toast('Сессия сброшена');
      pgLogin(app);
    };
  }

  card.addEventListener('submit', async ev => {
    ev.preventDefault();
    const enteredCode = inp.value.trim();
    if (!enteredCode) return toast('Введите код клуба', true);

    btn.disabled = true;
    btn.textContent = 'Проверка кода…';

    // Очищаем старые данные сессии перед авторизацией
    const prevToken = S.tok;
    S.tok = '';
    S.code = '';
    S.me = null;
    if (S.st) S.st.me = null;
    CLUB_TID = '';
    try {
      localStorage.removeItem('tok');
      localStorage.removeItem('rpl_auth_code');
      localStorage.removeItem('rpl_club_tid');
    } catch (e) {}

    let r;
    try {
      r = await api('/login', { code: enteredCode });
    } catch (loginErr) {
      btn.disabled = false;
      btn.textContent = 'Войти в клуб';
      return toast(loginErr.message || 'Ошибка входа по коду', true);
    }

    if (!r || !r.token) {
      btn.disabled = false;
      btn.textContent = 'Войти в клуб';
      return toast('Не удалось войти по коду', true);
    }

    // Сохраняем новые реквизиты авторизованного клуба
    S.tok = r.token;
    S.code = r.code || enteredCode;
    const finalTeamName = r.teamName || (r.team?.name) || (r.teamId ? teamName(r.teamId) : null);
    S.me = {
      role: r.role,
      teamId: r.teamId || null,
      teamName: finalTeamName
    };
    if (r.teamId) {
      CLUB_TID = r.teamId;
    }

    try {
      localStorage.setItem('tok', r.token);
      localStorage.setItem('rpl_auth_code', S.code);
      if (r.teamId) localStorage.setItem('rpl_club_tid', r.teamId);
    } catch (x) {}

    if (S.st) {
      S.st.me = { ...S.me };
    }

    // Моментально обновляем шапку, чтобы отобразился верный клуб
    drawChrome();

    // Запрашиваем актуальный state с новым токеном
    try {
      const freshState = await api('/state');
      if (freshState) {
        S.st = freshState;
        // Личность берём из ответа /login, а не из state: state нужен только для данных
        S.st.me = { ...S.me };
      }
    } catch (x) {
      console.warn('Обновление state после логина:', x);
    }

    drawChrome();

    toast(`Вход выполнен: ${S.me.role === 'admin' ? 'Администратор' : S.me.teamName || 'Клуб'}`);
    const target = r.role === 'admin' ? '#/admin' : '#/club';
    location.hash = target;
    route();
  });
}

  }

  function renderTopTransfers(limit = 2) {
    const list = trTab === 'expensive'
      ? (topTr?.expensive || [])
      : (trTab === 'valuable' ? (topTr?.valuable || []) : (topTr?.flops || []));
    if (!list.length) {
      return `<div class="empty" style="padding:16px 0;color:var(--muted)">${trTab === 'flop' ? 'Провальных трансферов с переплатой не обнаружено.' : 'В текущем сезоне трансферов пока не совершено.'}</div>`;
    }
    const sliced = limit ? list.slice(0, limit) : list;
    return sliced.map((t, idx) => renderTransferItem(t, idx, trTab)).join('');
  }

  function showTopTransfersModal() {
    let modalTab = trTab;
    function modalContent() {
      const list = modalTab === 'expensive'
        ? (topTr?.expensive || [])
        : (modalTab === 'valuable' ? (topTr?.valuable || []) : (topTr?.flops || []));
      const bodyHtml = list.length
        ? list.slice(0, 10).map((t, idx) => renderTransferItem(t, idx, modalTab)).join('')
        : `<div class="empty">${modalTab === 'flop' ? 'Провальных трансферов с переплатой не обнаружено' : 'Нет данных'}</div>`;

      return `
        <div class="row sp" style="margin-bottom:12px">
          <div class="row" style="gap:8px">
            <span style="font-size:22px">🔥</span>
            <div>
              <h3 style="margin:0">Топ-10 трансферов лиги</h3>
              <div class="muted small">Рейтинг переходов сезона ${e(S.st?.season || '2026/27')}</div>
            </div>
          </div>
          <button class="btn alt sm" id="m_tr_close" style="padding:4px 8px">✕</button>
        </div>
        <div class="tabs" style="margin-bottom:12px">
          <button id="m_btn_exp" class="${modalTab === 'expensive' ? 'on' : ''}">💎 Самые дорогие (Топ-10)</button>
          <button id="m_btn_val" class="${modalTab === 'valuable' ? 'on' : ''}">⚡ Самые выгодные (Топ-10)</button>
          <button id="m_btn_flop" class="${modalTab === 'flop' ? 'on' : ''}">📉 Самые провальные (Топ-10)</button>
        </div>
        <div id="m_tr_body" style="max-height:60vh;overflow-y:auto;padding-right:4px">
          ${bodyHtml}
        </div>
      `;
    }

    const m = modal(modalContent(), mEl => {
      mEl.querySelector('#m_tr_close')?.addEventListener('click', () => m.remove());
      const bExp = mEl.querySelector('#m_btn_exp');
      const bVal = mEl.querySelector('#m_btn_val');
      const bFlop = mEl.querySelector('#m_btn_flop');
      const bBody = mEl.querySelector('#m_tr_body');
      if (bExp && bVal && bBody) {
        const updateModalTab = (tabName, btnOn) => {
          modalTab = tabName;
          [bExp, bVal, bFlop].forEach(b => b?.classList.remove('on'));
          btnOn?.classList.add('on');
          const l = modalTab === 'expensive'
            ? (topTr?.expensive || [])
            : (modalTab === 'valuable' ? (topTr?.valuable || []) : (topTr?.flops || []));
          bBody.innerHTML = l.length
            ? l.slice(0, 10).map((t, idx) => renderTransferItem(t, idx, modalTab)).join('')
            : `<div class="empty">${modalTab === 'flop' ? 'Провальных трансферов с переплатой не обнаружено' : 'Нет данных'}</div>`;
        };
        bExp.onclick = () => updateModalTab('expensive', bExp);
        bVal.onclick = () => updateModalTab('valuable', bVal);
        bFlop && (bFlop.onclick = () => updateModalTab('flop', bFlop));
      }
    });
  }

  const hasAnyTransfers = (topTr?.expensive?.length || 0) > 0 || (topTr?.valuable?.length || 0) > 0 || (topTr?.flops?.length || 0) > 0;

  app.innerHTML = `<h1>Сезон ${e(S.st?.season || '2026/27')}</h1>

  ${live.length ? `<div class="panel"><h3><span class="live-dot"></span>Сейчас идут</h3>${live.map(fxRow).join('')}</div>` : ''}
  <div class="grid g2">
    <div>
      <div class="panel"><h3>Ближайшие матчи РПЛ</h3>${next.length ? next.map(fxRow).join('') : '<div class="empty">Расписание ещё не создано или сезон завершён.</div>'}</div>
      <div class="panel"><h3>Последние результаты</h3>${last.length ? last.map(fxRow).join('') : '<div class="empty">Матчей пока не было.</div>'}</div>
      <div class="panel" id="home_top_transfers">
        <div class="row sp" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <div style="display:flex;align-items:center;gap:8px;cursor:pointer" id="tr_header_title" title="Нажмите, чтобы открыть Топ-10 трансферов">
            <span style="font-size:18px">🔥</span>
            <h3 style="margin:0;display:inline-flex;align-items:center;gap:6px">
              Топ трансферы
            </h3>
          </div>
          <div class="row" style="gap:6px;align-items:center;flex-wrap:wrap">
            <div class="tabs" style="margin:0">
              <button id="btn_tr_exp" class="on" style="padding:4px 8px;font-size:12px">💎 Дорогие</button>
              <button id="btn_tr_val" style="padding:4px 8px;font-size:12px">⚡ Выгодные</button>
              <button id="btn_tr_flop" style="padding:4px 8px;font-size:12px">📉 Провальные</button>
            </div>
            ${hasAnyTransfers ? `
              <button class="btn alt sm" id="open_top_transfers_modal" style="font-size:12px;padding:3px 8px;font-weight:700" title="Открыть окно с топ-10 трансферами">
                Топ-10 ↗
              </button>
            ` : ''}
          </div>
        </div>
        <div id="top_transfers_box">
          ${renderTopTransfers(2)}
        </div>
        ${hasAnyTransfers ? `
          <div style="margin-top:10px;text-align:center;border-top:1px dashed var(--line);padding-top:8px">
            <button class="btn alt sm" id="btn_more_transfers" style="font-size:12px;width:100%;justify-content:center">
              Показать полный Топ-10 трансферов →
            </button>
          </div>
        ` : ''}
      </div>
    </div>
    <div class="panel">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <img src="/logos/leagues/rpl.svg" alt="РПЛ" style="width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.15));"/>
        <h3 style="margin:0;">Таблица РПЛ</h3>
      </div>
      ${tb.some(r => r.p) || tb.length ? tableHtml(tb, { top: 3, bad: 2 }) : '<div class="empty">Нет команд</div>'}
      <p class="small" style="margin-top:12px"><a href="#/table/rpl">Все турнирные таблицы с эмблемами лиг →</a></p>
    </div>
  </div>`;

  const btnExp = $('#btn_tr_exp');
  const btnVal = $('#btn_tr_val');
  const btnFlop = $('#btn_tr_flop');
  const box = $('#top_transfers_box');

  if (btnExp && btnVal && box) {
    const setTrTab = (tabName, btnOn) => {
      trTab = tabName;
      [btnExp, btnVal, btnFlop].forEach(b => b?.classList.remove('on'));
      btnOn?.classList.add('on');
      box.innerHTML = renderTopTransfers(2);
    };
    btnExp.onclick = () => setTrTab('expensive', btnExp);
    btnVal.onclick = () => setTrTab('valuable', btnVal);
    btnFlop && (btnFlop.onclick = () => setTrTab('flop', btnFlop));
  }

  $('#tr_header_title')?.addEventListener('click', showTopTransfersModal);
  $('#open_top_transfers_modal')?.addEventListener('click', showTopTransfersModal);
  $('#btn_more_transfers')?.addEventListener('click', showTopTransfersModal);
}

function renderCompTabs(curComp, prefix = 'table') {
  const groups = [
    { id: 'rpl', name: 'РПЛ', compId: 'rpl', logo: '/logos/leagues/rpl.svg' },
    { id: 'supercup', name: 'Суперкубок', compId: 'supercup', logo: '/logos/leagues/supercup.svg' },
    { id: 'cup', name: 'Кубок России', compId: 'cup', logo: '/logos/leagues/cup.svg' },
    { id: 'fnl', name: 'Первая лига', compId: 'fnl', logo: '/logos/leagues/fnl.svg' },
    { id: '2la', name: 'Вторая лига «А»', compId: '2la_gold', logo: '/logos/leagues/2la.svg', children: [
      { id: '2la_gold', name: '🥇 Группа «Золото»' },
      { id: '2la_silver', name: '🥈 Группа «Серебро»' }
    ]},
    { id: '2lb', name: 'Вторая лига «Б»', compId: '2lb_1', logo: '/logos/leagues/2lb.svg', children: [
      { id: '2lb_1', name: 'Группа 1 · Юг' },
      { id: '2lb_2', name: 'Группа 2 · Запад' },
      { id: '2lb_3', name: 'Группа 3 · Центр' },
      { id: '2lb_4', name: 'Группа 4 · Урал' }
    ]},
    { id: 'media', name: 'Медиалига', compId: 'media', logo: '/logos/leagues/media.svg', children: [
      { id: 'media', name: 'Winline МФЛ' },
      { id: 'media_div2', name: 'Второй дивизион' },
      { id: 'media_cup', name: 'Winline Кубок Лиги' }
    ]}
  ];

  const activeGroup = groups.find(g => g.compId === curComp || g.children?.some(c => c.id === curComp)) || groups[0];

  let html = `<div class="tabs">${groups.map(g => {
    const isAct = g.id === activeGroup.id;
    return `<button class="${isAct ? 'on' : ''}" data-nav="${g.compId}"><img src="${g.logo}" alt="" class="tab-comp-icon"/><span>${e(g.name)}</span></button>`;
  }).join('')}</div>`;

  if (activeGroup.children) {
    html += `<div class="tabs sub-tabs" style="margin-top:-6px;margin-bottom:14px;background:var(--soft);padding:6px 8px;border-radius:8px;">${activeGroup.children.map(c => {
      const isAct = c.id === curComp;
      return `<button class="${isAct ? 'on' : ''}" style="font-size:13px;padding:4px 10px;border-bottom-width:2px;" data-nav="${c.id}">${e(c.name)}</button>`;
    }).join('')}</div>`;
  }

  return html;
}

let CUP_TAB = 'groups';

function renderCupView(cupData) {
  const st = cupData.state || {};
  const fx = Array.isArray(cupData.fixtures) ? cupData.fixtures : [];
  const groups = st.rplGroups || {};

  let body = '';
  if (CUP_TAB === 'groups') {
    body = `
    <div class="cup-groups-grid">
      ${['A', 'B', 'C', 'D'].map(gid => {
        const g = groups[gid];
        if (!g) return '';
        const gFx = fx.filter(f => f.cupInfo?.group === gid || (f.label || '').includes(`Группа ${gid}`));
        return `<div class="cup-group-card">
          <div class="row sp" style="margin-bottom:10px">
            <h3 style="margin:0;display:flex;align-items:center;gap:8px">
              <span class="tag bg" style="font-weight:800;color:var(--deep);border-color:var(--green)">${e(g.name)}</span>
            </h3>
          </div>
          <div class="wrap">
            <table>
              <thead>
                <tr>
                  <th class="l">Клуб</th>
                  <th title="Игры">И</th>
                  <th title="Победы в осн. время (3 очка)">В</th>
                  <th title="Победы по пенальти (2 очка)">ВП</th>
                  <th title="Поражения по пенальти (1 очко)">ПП</th>
                  <th title="Поражения в осн. время (0 очков)">П</th>
                  <th title="Мячи">М</th>
                  <th title="Очки">О</th>
                </tr>
              </thead>
              <tbody>
                ${(g.table || []).map(r => {
                  const zcls = r.pos <= 2 ? 'zone-top' : (r.pos === 3 ? 'zone-playoff' : 'zone-bad');
                  const tLogo = teamLogo(r.id);
                  return `<tr class="${zcls}">
                    <td class="l">
                      <div class="t-cell">
                        <span class="pos">${r.pos}</span>
                        ${tLogo ? `<img class="t-logo" src="${tLogo}" alt=""/>` : ''}
                        <span>${e(r.name)}</span>
                      </div>
                    </td>
                    <td>${r.p}</td>
                    <td>${r.w}</td>
                    <td>${r.wp || 0}</td>
                    <td>${r.lp || 0}</td>
                    <td>${r.l}</td>
                    <td class="muted">${r.gf}:${r.ga}</td>
                    <td><b>${r.pts}</b></td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
          <div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:8px">
            <div class="small muted" style="font-weight:600;margin-bottom:6px">Матчи группы:</div>
            ${gFx.length ? gFx.slice(0, 6).map(fxRow).join('') : '<div class="muted small">Матчи не сыграны</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  } else if (CUP_TAB === 'regions') {
    const qualFx = fx.filter(f => f.cupInfo?.path === 'regions' || (f.label || '').includes('Путь регионов'));
    const rounds = [...new Set(qualFx.map(f => f.label || (f.cupInfo?.stage || 'Отборочный раунд')))];
    body = `
    <div class="panel">
      <h3>Матчи раундов Пути регионов</h3>
      ${rounds.length ? rounds.map(rLabel => {
        const list = qualFx.filter(f => (f.label || f.cupInfo?.stage) === rLabel);
        return `<div style="margin-bottom:16px"><h4 style="margin:8px 0 6px;color:var(--deep)">${e(rLabel)}</h4>${list.map(fxRow).join('')}</div>`;
      }).join('') : '<div class="empty">Отборочные матчи Пути регионов сформируются при создании сезона.</div>'}
    </div>`;
  } else if (CUP_TAB === 'playoff') {
    const playFx = fx.filter(f => ['r16', 'qf', 'sf', 'playoff'].includes(f.cupInfo?.stage) || (f.label || '').includes('1/8') || (f.label || '').includes('1/4') || (f.label || '').includes('1/2'));
    body = `
    <div class="panel">
      <h3>Матчи плей-офф</h3>
      ${playFx.length ? playFx.map(fxRow).join('') : '<div class="empty">Матчи весеннего плей-офф стартуют после завершения группового этапа и 6 раундов Пути регионов.</div>'}
    </div>`;
  } else if (CUP_TAB === 'final') {
    const finalFx = fx.find(f => f.cupInfo?.stage === 'super_final' || f.cupInfo?.path === 'final' || (f.label || '').includes('Финал'));
    body = `
    <div class="panel score" style="text-align:center;padding:32px 20px">
      <span class="tag gold" style="font-weight:800;letter-spacing:1px;margin-bottom:12px;background:#ffd700;color:#3d2f00">СУПЕРФИНАЛ КУБКА РОССИИ 2026/2027</span>
      <h1 style="color:#fff;margin:10px 0">Победитель Пути РПЛ — Победитель Пути регионов</h1>
      <div style="font-size:16px;color:#d2eedb;margin-bottom:12px">📅 6 июня 2027 года · 🏟️ Москва, БСА «Лужники» (нейтральное поле)</div>
      <div style="margin-bottom:18px"><span class="badge" style="background:#fef3c7;color:#92400e;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid #fde047">Все финалы Кубка России проводятся в Лужниках на нейтральном поле</span></div>
      <div style="max-width:540px;margin:0 auto;background:rgba(0,0,0,0.3);padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.15)">
        ${finalFx ? fxRow(finalFx) : '<div style="color:#b8d2c1">Участники Суперфинала определятся по итогам полуфинальных матчей в мае 2027 года. Победитель завоёвывает Хрустальный Кубок России!</div>'}
      </div>
    </div>`;
  }

  return `
  <div class="tabs cup-tabs" style="margin-top:12px">
    ${[
      ['groups', '🏆 Путь РПЛ'],
      ['regions', '🌍 Путь регионов'],
      ['playoff', '⚔️ Плей-офф'],
      ['final', '👑 Финал']
    ].map(([id, title]) => `<button class="${CUP_TAB === id ? 'on' : ''}" data-cup-tab="${id}">${title}</button>`).join('')}
  </div>
  ${body}`;
}

async function pgTable(app, comp = 'rpl') {
  const currentCompObj = (S.st?.comps || []).find(c => c.id === comp);

  const logoUrl = compLogo(comp);

  if (comp === 'supercup') {
    const rawList = await api('/fixtures?comp=supercup').catch(() => []);
    const f = rawList[0];
    const isDone = f?.status === 'done';
    const isLive = f?.status === 'live';
    const hTeam = (S.st?.teams || []).find(t => t.id === f?.home);
    const aTeam = (S.st?.teams || []).find(t => t.id === f?.away);
    const hName = hTeam?.name || f?.homeName || 'Спартак';
    const aName = aTeam?.name || f?.awayName || 'Зенит';

    const aLogo = teamLogo(f?.away || aTeam?.id);

      else if (f.ag > f.hg) winnerName = aName;

async function pgFixtures(app, comp = 'rpl', round) {
  const currentCompObj = (S.st?.comps || []).find(c => c.id === comp);
  const title = currentCompObj?.name || 'Расписание';
  const logoUrl = compLogo(comp);

  const infoBadge = comp === 'rpl'
    ? `<div class="muted small" style="margin-bottom:12px;background:var(--soft);padding:8px 12px;border-radius:6px;border:1px solid var(--line)">📅 <b>Календарь РПЛ:</b> без кубка Пути РПЛ на неделе — матчи начинаются с пятницы: Пт (1 матч 19:00), Сб (3–4 матча), Вс (3–4 матча); в кубковые недели — Сб (3 матча), Вс (4 матча), Пн (1 матч). Матчи не пересекаются с паузами на сборные и зимним перерывом.</div>`
    : (comp === 'supercup'
      ? `<div class="muted small" style="margin-bottom:12px;background:#fefce8;padding:8px 12px;border-radius:6px;border:1px solid #fde047;color:#854d0e">🏆 <b>Суперкубок России:</b> официальный матч открытия футбольного сезона за национальный Суперкубок на нейтральном стадионе между Чемпионом России и Обладателем Кубка страны.</div>`
      : (comp === 'cup'
        ? `<div class="muted small" style="margin-bottom:12px;background:var(--soft);padding:8px 12px;border-radius:6px;border:1px solid var(--line)">🏆 <b>FONBET Кубок России:</b> недели Пути регионов и Пути РПЛ строго чередуются через неделю. В Пути РПЛ каждый тур: Вт (2 матча), Ср (4 матча), Чт (2 матча). Плей-офф составляется только после завершения группового этапа.</div>`
        : ''));

  const viewSwitcher = `
  <div class="row sp" style="margin-bottom:12px;align-items:center;flex-wrap:wrap;gap:8px">
    <div class="tabs" style="margin:0">
      <button class="${FX_VIEW === 'rounds' ? 'on' : ''}" data-fxv="rounds">📋 По турам</button>
      <button class="${FX_VIEW === 'calendar' ? 'on' : ''}" data-fxv="calendar">🗓️ Календарик событий</button>
    </div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">
      <div class="tabs time-mode-tabs" style="margin:0" title="Переключение режима отображения времени">
        <button class="${TIME_MODE === 'game' ? 'on' : ''}" data-tmode="game" title="Игровой футбольный календарь (недельные интервалы, матчи по выходным)">🎮 Игровое время</button>
        <button class="${TIME_MODE === 'real' ? 'on' : ''}" data-tmode="real" title="Реалистичное время трансляций (1 тур в день, случайное время по МСК)">⏰ Реальное время</button>
      </div>
      ${TIME_MODE === 'real' ? `
        <div class="row" style="gap:4px;align-items:center;background:var(--soft);padding:3px 6px;border-radius:6px;border:1px solid var(--line);font-size:12px">
          <span class="muted small">Пояс:</span>
          <button class="tz-toggle-pill ${TIME_ZONE_MODE === 'local' ? 'active' : ''}" data-tz="local" title="Синхронизация с вашим устройством">📱 ${getUserTzAbbr()}</button>
          <button class="tz-toggle-pill ${TIME_ZONE_MODE === 'msk' ? 'active' : ''}" data-tz="msk" title="Московское время (UTC+3)">🏛️ МСК</button>
        </div>
      ` : ''}
    </div>
  </div>`;

  if (FX_VIEW === 'calendar') {
    const [allRawResp, ntData] = await Promise.all([
      api('/fixtures').catch(() => []),
      api('/national').catch(() => ({ breaks: [] }))
    ]);
    const allRaw = Array.isArray(allRawResp) ? allRawResp : [];

    const activeFilter = CAL_COMP_FILTER;
    const breaks = ntData.breaks || [];

    // Определяем сетку выбранного месяца
    const firstDayDate = new Date(Date.UTC(CAL_YEAR, CAL_MONTH, 1));
    const startDow = (firstDayDate.getUTCDay() + 6) % 7; // 0 for Mon, 6 for Sun
    const daysInMonth = new Date(Date.UTC(CAL_YEAR, CAL_MONTH + 1, 0)).getUTCDate();
    const daysInPrevMonth = new Date(Date.UTC(CAL_YEAR, CAL_MONTH, 0)).getUTCDate();

    // Группируем матчи по датам
    const matchesByDate = {};
    (allRaw || []).forEach(f => {
      if (!f.date) return;
      if (activeFilter !== 'all' && f.comp !== activeFilter) return;
      matchesByDate[f.date] = matchesByDate[f.date] || [];
      matchesByDate[f.date].push(f);
    });

    // Добавляем товарищеские матчи сборной
    if (activeFilter === 'all' || activeFilter === 'national') {
      (ntData?.current?.matches || []).forEach(m => {
        if (!m.date) return;
        matchesByDate[m.date] = matchesByDate[m.date] || [];
        matchesByDate[m.date].push({
          id: 'nt_' + m.id,
          comp: 'national',
          date: m.date,
          time: m.time,
          label: 'Товарищеский матч',
          homeName: m.home ? 'Россия' : m.opponent,
          awayName: m.home ? m.opponent : 'Россия',
          status: 'scheduled',
          isNational: true
        });
      });
    }

    // Рендерим ячейки календаря
    const cells = [];
    // Дни предыдущего месяца
    for (let p = startDow - 1; p >= 0; p--) {
      const dNum = daysInPrevMonth - p;
      cells.push(`<div class="cal-cell other-month"><div class="cal-day-num">${dNum}</div></div>`);
    }

    // Дни текущего месяца
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${CAL_YEAR}-${String(CAL_MONTH + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isSel = CAL_SELECTED_DAY === dateStr;
      const curBreak = breaks.find(b => dateStr >= b.start && dateStr <= b.end);
      const isWinter = breaks.some(b=>String(b.id).indexOf('winter_break')===0 && dateStr >= b.start && dateStr <= b.end);
      const mList = matchesByDate[dateStr] || [];

      let cellClasses = 'cal-cell';
      if (isSel) cellClasses += ' selected';
      if (curBreak) cellClasses += ' has-break';
      if (isWinter) cellClasses += ' has-winter';

      let periodBadge = '';
      if (curBreak) periodBadge = `<span class="cal-period-badge break" title="${e(curBreak.name)}">🇷🇺 Сборные</span>`;
      else if (isWinter) periodBadge = `<span class="cal-period-badge winter" title="Зимний перерыв в РПЛ">❄️ Перерыв</span>`;

      const compCounts = {};
      mList.forEach(f => {
        const c = f.comp || 'other';
        compCounts[c] = (compCounts[c] || 0) + 1;
      });

      const compMeta = {
        rpl: { label: 'РПЛ', cls: 'rpl', title: 'Мир Российская Премьер-Лига' },
        supercup: { label: 'Суперкубок', cls: 'cup', title: 'Суперкубок России' },
        cup: { label: 'FONBET Кубок', cls: 'cup', title: 'FONBET Кубок России' },
        media_cup: { label: 'Кубок Лиги', cls: 'media_cup', title: 'Winline Кубок Лиги' },
        fnl: { label: 'Первая лига', cls: 'fnl', title: 'МЕЛБЕТ-Первая Лига' },
        '2la': { label: 'Вторая А', cls: 'fnl2a', title: 'Вторая лига «А»' },
        '2lb': { label: 'Вторая Б', cls: 'fnl2b', title: 'Вторая лига «Б»' },
        media: { label: 'Медиалига', cls: 'media', title: 'Winline Медиалига' },
        national: { label: '🇷🇺 Сборная', cls: 'national', title: 'Товарищеский матч сборной' },
        other: { label: 'Матч', cls: 'other', title: 'Матч' }
      };

      const tournamentBadges = Object.entries(compCounts).map(([cKey, count]) => {
        const meta = compMeta[cKey] || { label: cKey.toUpperCase(), cls: 'other', title: cKey };
        return `<div class="cal-tourn-pill ${meta.cls}" title="${meta.title}: ${count} ${count === 1 ? 'матч' : (count < 5 ? 'матча' : 'матчей')}">
          <span class="cal-tourn-dot"></span>
          <span class="cal-tourn-name">${meta.label}</span>
          ${count > 1 ? `<span class="cal-tourn-badge-count">${count}</span>` : ''}
        </div>`;
      }).join('');

      cells.push(`
        <div class="${cellClasses}" data-cal-day="${dateStr}">
          <div class="cal-day-num">
            <span>${d}</span>
            ${periodBadge}
          </div>
          <div style="display:flex;flex-direction:column;gap:3px;margin-top:4px;overflow:hidden">
            ${tournamentBadges}
          </div>
        </div>
      `);
    }

    // Если день выбран, рендерим панель событий дня
    let selectedDayHtml = '';
    if (CAL_SELECTED_DAY) {
      const curBreak = breaks.find(b => CAL_SELECTED_DAY >= b.start && CAL_SELECTED_DAY <= b.end);
      const isWinter = breaks.some(b=>String(b.id).indexOf('winter_break')===0 && CAL_SELECTED_DAY >= b.start && CAL_SELECTED_DAY <= b.end);
      const dayList = matchesByDate[CAL_SELECTED_DAY] || [];
      selectedDayHtml = `
      <div class="panel" style="margin-top:16px;border:1.5px solid var(--green)">
        <div class="row sp" style="margin-bottom:10px">
          <h3 style="margin:0">События на ${fmtD(CAL_SELECTED_DAY)} (${fmtDayOfWeek(CAL_SELECTED_DAY)})</h3>
          <span class="tag">${dayList.length} событий</span>
        </div>
        ${curBreak ? `<div class="panel" style="background:#fee2e2;border:1px solid #fca5a5;padding:8px 12px;margin-bottom:10px"><b>🇷🇺 ${e(curBreak.name)}</b>: пауза в чемпионатах на матчи национальных сборных.</div>` : ''}
        ${isWinter ? `<div class="panel" style="background:#e0f2fe;border:1px solid #bae6fd;padding:8px 12px;margin-bottom:10px"><b>❄️ Зимний перерыв в РПЛ</b>: клубы проводят сборы и товарищеские матчи.</div>` : ''}
        ${dayList.length ? dayList.map(f => {
          if (f.isNational) {
            return `<div class="row sp" style="padding:10px 12px;background:var(--soft);border-radius:8px;margin-bottom:8px">
              <div style="display:flex;align-items:center;gap:8px"><img src="/assets/aistudio/russia_russia-national-team.football-logos.cc_2a5e3ddc.svg" alt="" style="width:18px;height:18px;object-fit:contain"/><span class="tag live" style="background:#b91c1c">Сборная России</span> <b>${e(f.homeName)} — ${e(f.awayName)}</b> · ${e(f.time)}</div>
              <a class="btn alt sm" href="#/national">В раздел Сборная</a>
            </div>`;
          }
          return fxRow(f);
        }).join('') : '<div class="empty">Матчей и событий на этот день нет.</div>'}
      </div>`;
    }

    app.innerHTML = `
    <div class="comp-banner">
      <img src="${logoUrl}" alt="${e(title)}" class="comp-banner-logo" onerror="this.style.display='none'"/>
      <div>
        <h1 class="comp-banner-title">Календарь футбольных событий</h1>
        <div class="comp-banner-sub">Сезон ${e(S.st?.season || '2026/27')} · Все матчи, кубковые мидвики, паузы на сборные и зимний перерыв</div>
      </div>
    </div>
    ${viewSwitcher}
    ${infoBadge}

    <div class="cal-container">
      <div class="cal-nav-bar">
        <div class="row" style="gap:8px;align-items:center">
          <button class="btn alt sm" id="cal_prev">← Предыдущий</button>
          <b style="font-size:17px;font-family:Unbounded,sans-serif">${MONTH_NAMES[CAL_MONTH]} ${CAL_YEAR}</b>
          <button class="btn alt sm" id="cal_next">Следующий →</button>
        </div>
        <div class="row" style="gap:8px;align-items:center">

            <option value="all" ${activeFilter === 'all' ? 'selected' : ''}>Все турниры и события</option>
            <option value="rpl" ${activeFilter === 'rpl' ? 'selected' : ''}>РПЛ</option>
            <option value="supercup" ${activeFilter === 'supercup' ? 'selected' : ''}>🏆 Суперкубок России</option>
            <option value="cup" ${activeFilter === 'cup' ? 'selected' : ''}>FONBET Кубок России</option>
            <option value="media_cup" ${activeFilter === 'media_cup' ? 'selected' : ''}>Winline Кубок Лиги</option>
            <option value="fnl" ${activeFilter === 'fnl' ? 'selected' : ''}>Первая лига</option>
            <option value="national" ${activeFilter === 'national' ? 'selected' : ''}>Сборная России (паузы и матчи)</option>

        <div class="cal-weekday">Ср</div>
        <div class="cal-weekday">Чт</div>

        <div class="cal-weekday">Сб</div>

        <span class="table-legend-item"><span class="table-legend-dot" style="background:#b91c1c"></span> <b>🏆 Суперкубок России</b></span>
        <span class="table-legend-item"><span class="table-legend-dot" style="background:#d97706"></span> <b>FONBET Кубок России</b> (мидвики)</span>
        <span class="table-legend-item"><span class="table-legend-dot" style="background:#7e22ce"></span> <b>Winline Кубок Лиги</b></span>
        <span class="table-legend-item"><span class="table-legend-dot" style="background:#2563eb"></span> <b>Первая лига</b></span>
        <span class="table-legend-item"><span class="table-legend-dot" style="background:#e11d48"></span> <b>🇷🇺 Сборные</b></span>
        <span class="table-legend-item"><span class="table-legend-dot" style="background:#0284c7"></span> <b>❄️ Зимний перерыв</b></span>
      </div>

    app.querySelectorAll('[data-fxv]').forEach(b => b.onclick = () => {
      FX_VIEW = b.dataset.fxv;
      pgFixtures(app, comp);
    });

    $('#cal_prev').onclick = () => {
      CAL_MONTH--;
      if (CAL_MONTH < 0) { CAL_MONTH = 11; CAL_YEAR--; }
      pgFixtures(app, comp);
    };

    const cNext = $('#cal_next');
    if (cNext) {
      cNext.onclick = () => {
        CAL_MONTH++;
        if (CAL_MONTH > 11) { CAL_MONTH = 0; CAL_YEAR++; }
        pgFixtures(app, comp);
      };
    }

    const cFilter = $('#cal_filter');
    if (cFilter) {
      cFilter.onchange = () => {
        CAL_COMP_FILTER = cFilter.value;
        pgFixtures(app, comp);
      };
    }

    app.querySelectorAll('[data-set-ym]').forEach(b => b.onclick = () => {
      const [y, m] = b.dataset.setYm.split('-').map(Number);
      CAL_YEAR = y;
      CAL_MONTH = m;
      pgFixtures(app, comp);
    });

    app.querySelectorAll('[data-cal-day]').forEach(b => b.onclick = () => {
      CAL_SELECTED_DAY = b.dataset.calDay;
      pgFixtures(app, comp);
    });

    app.querySelectorAll('[data-fxv]').forEach(b => b.onclick = () => {
      FX_VIEW = b.dataset.fxv;
      pgFixtures(app, comp);
    });
    app.querySelectorAll('[data-tmode]').forEach(b => b.onclick = () => {
      TIME_MODE = b.dataset.tmode;
      localStorage.setItem('rpl_time_mode', TIME_MODE);
      pgFixtures(app, comp);
    });
    app.querySelectorAll('[data-tz]').forEach(b => b.onclick = () => {
      TIME_ZONE_MODE = b.dataset.tz;
      localStorage.setItem('rpl_tz_mode', TIME_ZONE_MODE);
      pgFixtures(app, comp);
    });

    return;
  }

  // Режим отображения по турам (Round view)
  const rawAllResp = await api('/fixtures?comp=' + comp).catch(() => []);
  const rawAll = Array.isArray(rawAllResp) ? rawAllResp : [];
  let all = rawAll;
  if (comp === 'cup' && CUP_FX_FILTER === 'rpl') {
    all = rawAll.filter(f => f.cupPath === 'rpl_group');
  } else if (comp === 'cup' && CUP_FX_FILTER === 'regions') {
    all = rawAll.filter(f => f.cupPath === 'regions_qual');
  }

  const rounds = [...new Set(all.map(f => f.label))];
  let cur = round ? decodeURIComponent(round) : (all.find(f => f.status !== 'done') || all[all.length - 1] || {}).label;
  if (!rounds.includes(cur)) cur = rounds[0];
  const list = all.filter(f => f.label === cur), i = rounds.indexOf(cur);

  const rplCount = rawAll.filter(f => f.cupPath === 'rpl_group' || f.cupPath === 'rpl_playoff').length;
  const regCount = rawAll.filter(f => f.cupPath === 'regions_qual' || f.cupPath === 'regions_playoff').length;
  const cupFilterTabs = comp === 'cup' ? `
  <div class="tabs cup-tabs" style="margin-bottom:12px">
    <button class="${CUP_FX_FILTER === 'all' ? 'on' : ''}" data-cf="all">Все раунды Кубка (${rawAll.length})</button>

  </div>` : '';

  app.innerHTML = `
  <div class="comp-banner">
    <img src="${logoUrl}" alt="${e(title)}" class="comp-banner-logo" onerror="this.style.display='none'"/>

      <h1 class="comp-banner-title">${e(title)} · Расписание</h1>
      <div class="comp-banner-sub">${e(currentCompObj?.level || 'Сезон ' + (S.st?.season || '2026/27'))}</div>
    </div>
  </div>
  ${viewSwitcher}
  ${renderCompTabs(comp, 'fixtures')}
  ${infoBadge}
  ${cupFilterTabs}
  ${all.length ? `<div class="row sp" style="margin-bottom:12px"><button class="btn alt sm" id="pv" ${i <= 0 ? 'disabled' : ''}>← Назад</button><b>${e(cur)}</b><button class="btn alt sm" id="nx" ${i >= rounds.length - 1 ? 'disabled' : ''}>Вперёд →</button></div><div class="panel">${list.map(fxRow).join('')}</div>` : '<div class="empty panel">Расписание ещё не создано — администратор сделает это в разделе «Админка».</div>'}`;

  app.querySelectorAll('[data-fxv]').forEach(b => b.onclick = () => {
    FX_VIEW = b.dataset.fxv;
    pgFixtures(app, comp);
  });
  app.querySelectorAll('[data-tmode]').forEach(b => b.onclick = () => {
    TIME_MODE = b.dataset.tmode;
    localStorage.setItem('rpl_time_mode', TIME_MODE);
    pgFixtures(app, comp, round);
  });
  app.querySelectorAll('[data-tz]').forEach(b => b.onclick = () => {
    TIME_ZONE_MODE = b.dataset.tz;
    localStorage.setItem('rpl_tz_mode', TIME_ZONE_MODE);
    pgFixtures(app, comp, round);
  });
  app.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => location.hash = '#/fixtures/' + b.dataset.nav);
  app.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => {
    CUP_FX_FILTER = b.dataset.cf;
    pgFixtures(app, 'cup');
  });
  $('#pv') && ($('#pv').onclick = () => location.hash = `#/fixtures/${comp}/${encodeURIComponent(rounds[i - 1])}`);
  $('#nx') && ($('#nx').onclick = () => location.hash = `#/fixtures/${comp}/${encodeURIComponent(rounds[i + 1])}`);
}

/* ───── матч ───── */
const EVI = { goal: '⚽', own_goal: '⚽', yellow: '🟨', red: '🟥', injury: '🚑', penalty: '🎯', var: '📺', ref_error: '🧑‍⚖️', halftime: '⏸', fulltime: '🏁', highlight: '🔥', incident: '❗', save: '🧤', post: '🥅', sub: '🔁', corner: '🚩', foul: '✋', shot: '💥', miss: '↗', tackle: '🛡', kickoff: '▶', offside: '🚫', freekick: '🎯', possession: '·', pass: '·', dribble: '·', duel: '·', commentator_intro: '🎙', tactical_note: '📋', stat_display: '📊', crowd: '📣', lineup: '📃', walkout: '🚶', anthem: '🎶', coin_toss: '🪙', photo: '📸', warmup: '🏃', kickoff_buildup: '⏳', kit_issue: '👕', verbal_warning: '☝️', cooling_break: '💧' };
const fmtEvT = x => { const t = x.min * 60 + (x.sec || 0), a = Math.abs(t); return (t < 0 ? '−' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); };
let M = null, evs = [], mtab = 'live';

async function pgMatch(app, id) {
  M = await api('/match/' + id);
  evs = (M.events || []).slice();
  if (!M.fixture) return;
  mtab = 'live';
  drawMatch(app, id);
  if (M.fixture.status === 'live') {
    S.es = new EventSource('/api/live/' + id);
    S.es.onmessage = m => {
      const d = JSON.parse(m.data);
      if (d.type === 'event') {
        if (!evs.some(x => x.i === d.e.i)) evs.push(d.e);
        M.fixture.hg = d.e.score[0];
        M.fixture.ag = d.e.score[1];
        paintMatch();
        if (['goal', 'red', 'yellow'].includes(d.e.type)) refreshStats(id);
      } else if (d.type === 'end') {
        api('/match/' + id).then(x => { M = x; evs = (x.events || []).slice(); drawMatch(app, id); });
        S.es.close();
      }
    };
  }
  if (M.fixture.status === 'scheduled' || M.fixture.status === 'queued' || M.fixture.status === 'generating') {
    const t = setInterval(async () => {
      if (!location.hash.includes(id)) return clearInterval(t);
      const x = await api('/match/' + id);
      if (x.fixture.status !== M.fixture.status) { clearInterval(t); pgMatch(app, id); }
    }, 4000);
  }
}

async function refreshStats(id) {
  try {
    const x = await api('/match/' + id);
    M.stats = x.stats;
    if (mtab === 'stats') paintMatch();
  } catch { }
}

function drawMatch(app, id) {

  const motmTeamLogo = motmPlayer ? (motmPlayer.teamLogo || teamLogo(motmPlayer.teamId || motmPlayer.team)) : null;

  app.innerHTML = `
  <div style="margin-bottom:12px;display:flex;align-items:center;gap:10px">
    <button id="btn-back" class="btn alt sm" type="button" style="cursor:pointer">← Назад</button>
    <span class="muted small">${e(c ? c.comp + (c.roundLabel ? ' · ' + c.roundLabel : '') : f.label)}</span>

  <div class="meta" style="font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap">
    <span>🎮 Игровое: <b>${fmtD(f.gameDate || f.date)} ${f.gameTime || f.time || ''}</b></span> · 
    <span>⏰ Реальное: <b>${fmtD(f.realDate || f.date)} ${f.realTime ? f.realTime + ' МСК' : ''}</b></span>
    ${S.me?.role === 'admin' ? `<button id="btn_edit_match_schedule" class="btn alt sm" type="button" style="padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px;cursor:pointer">✏️ Изменить дату и время</button>` : ''}
  </div>
  ${f.refereeName ? `<div class="meta" style="margin-top:4px;font-size:12px">Судья: <b>${e(f.refereeName)}</b>${f.assistants?.length ? ` · Помощники: ${f.assistants.map(e).join(', ')}` : ''}${f.reserveReferee ? ` · Резервный: ${e(f.reserveReferee)}` : ''}${f.varReferee ? ` · ВАР: ${e(f.varReferee)}` : ''}${f.avarReferee ? ` · АВАР: ${e(f.avarReferee)}` : ''}</div>` : ''}
  <div class="line">
    <div class="tm-box r">
      <div class="tm r">${e(f.homeName)}</div>
      ${homeLogo ? `<img class="t-logo lg" src="${homeLogo}" alt="${e(f.homeName)}"/>` : ''}
    </div>
    <div class="num" id="sc">${f.hg == null ? '—' : f.hg + ' : ' + f.ag}</div>
    <div class="tm-box">
      ${awayLogo ? `<img class="t-logo lg" src="${awayLogo}" alt="${e(f.awayName)}"/>` : ''}
      <div class="tm">${e(f.awayName)}</div>
    </div>
  </div>
  <div class="meta" id="sub">${f.status === 'live' ? '<span class="live-dot"></span>Идёт матч' : f.status === 'done' ? 'Матч завершён' + (f.pen ? ` · по пенальти ${f.pen.hg}:${f.pen.ag}` : '') : f.status === 'generating' || f.status === 'queued' ? 'Матч готовится…' : 'Матч ещё не начался'}</div>
  ${S.me?.role === 'admin' && f.status === 'scheduled' ? `<div style="margin-top:10px"><button id="btn_start_match" class="btn" type="button" style="cursor:pointer;font-weight:700">▶ Начать игру</button></div>` : ''}
  ${c && c.weather ? `
  <div class="meta" style="margin-top:8px;padding:6px 12px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;display:inline-flex;align-items:center;gap:8px;color:#0369a1;font-size:13px">
    <span>${(c.weatherDetails && c.weatherDetails.icon) || '🌤️'}</span>
    <span><b>Погода:</b> ${e(c.weather)}</span>
    ${c.derby && c.derby !== 'нет' ? (c.derby.startsWith('Принципиальный матч (НЕ дерби)') ? ` · <span class="tag" style="margin-left:4px;background:#ede9fe;color:#5b21b6;border-color:#c4b5fd">${e(c.derby.replace('Принципиальный матч (НЕ дерби): ', '').split('.')[0])}</span>` : ` · <span class="tag derby" style="margin-left:4px">${e(c.derby.split('.')[0])}</span>`) : ''}
  </div>` : ''}
</div>
${motm && motmPlayer ? `
<div class="motm-hero">
  <div class="row sp" style="gap:10px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="motm-badge">⭐ Игрок матча (MOTM)</span>
      ${motmTeamLogo ? `<img class="t-logo md" src="${motmTeamLogo}" alt=""/>` : ''}
      <b style="font-size:16px">${e(motmPlayer.name)}</b>
      <span class="tag">${e(motmPlayer.pos)} · ${e(motmPlayer.team || motmPlayer.teamName || '')}</span>
    </div>
    <div class="motm-rating" title="Оценка за матч">${motmPlayer.rating}</div>
  </div>
  <div style="margin-top:8px;font-size:13.5px;color:var(--ink)">${e(motm.headline || motm.interview?.headline || '')}</div>
</div>` : ''}
<div class="tabs" id="mt">${[['live', 'Трансляция'], ['stats', 'Статистика'], ['lineups', 'Составы'], ['h2h', 'Последние встречи'], ...(motm || f.status === 'done' ? [['interview', 'Интервью и MOTM']] : []), ...(S.me?.role === 'admin' ? [['admin', 'Админ']] : [])].map(([k, t]) => `<button data-k="${k}" class="${k === mtab ? 'on' : ''}">${t}</button>`).join('')}</div>
<div id="mbody"></div>`;

  const bBack = app.querySelector('#btn-back');
  if (bBack) {
    bBack.onclick = (ev) => {
      ev.preventDefault();
      if (PREV_HASH && PREV_HASH !== location.hash && !PREV_HASH.startsWith('#/match/')) {
        location.hash = PREV_HASH;
      } else if (f.comp) {
        location.hash = `#/fixtures/${f.comp}`;
      } else {
        location.hash = '#/';
      }
    };
  }

  $('#mt').onclick = ev => {
    const k = ev.target.dataset.k;
    if (k) {
      mtab = k;
      document.querySelectorAll('#mt button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
      paintMatch();
    }
  };
  const bStart = app.querySelector('#btn_start_match');
  if (bStart) {
    bStart.onclick = async () => {
      bStart.disabled = true;
      const r = await act(() => api('/admin/run', { fid: f.id }), r => r.full ? 'Матч запущен, идёт подготовка' : 'Счёт готов');
      if (r) pgMatch(app, id); else bStart.disabled = false;
    };
  }
  const bEdSched = app.querySelector('#btn_edit_match_schedule');
  if (bEdSched) {
    bEdSched.onclick = () => {
      window.openMatchScheduleModal(f, () => drawMatch(app, id));
    };
  }
  paintMatch();
}

function paintMatch() {
  const f = M.fixture, id = f.id;
  $('#sc') && ($('#sc').textContent = f.hg == null ? '—' : f.hg + ' : ' + f.ag);
  const b = $('#mbody');
  if (!b) return;

  if (mtab === 'live') {
    if (!evs.length) {
      b.innerHTML = `<div class="empty panel">${f.status === 'scheduled' ? 'Трансляция начнётся, когда матч будет запущен.' : 'Ждём первые события…'}</div>`;
      return;
    }
    b.innerHTML = '<div class="panel">' + [...evs].reverse().map(x => {
      const cls = x.type === 'goal' || x.type === 'own_goal' ? 'goal' : x.type === 'red' ? 'red' : ['yellow', 'injury', 'penalty', 'var', 'ref_error', 'highlight', 'incident', 'halftime', 'fulltime'].includes(x.type) ? 'key' : '';
      const tLogo = x.team === 'home' ? (f.homeLogo || teamLogo(f.home)) : (x.team === 'away' ? (f.awayLogo || teamLogo(f.away)) : null);
      return `<div class="ev ${cls}">
        <div class="m">${x.min < 0 ? 'до матча' : fmtEvT(x)}</div>
        <div>${tLogo ? `<img class="t-logo" src="${tLogo}" alt=""/>` : (EVI[x.type] || '·')}</div>
        <div>${e(x.text)}${cls && x.players?.length ? `<div class="pl">${e(x.players.join(', '))}</div>` : ''}${x.type === 'goal' || x.type === 'own_goal' ? `<div class="pl"><b>${x.score[0]}:${x.score[1]}</b></div>` : ''}</div>
      </div>`;
    }).join('') + '</div>';
  } else if (mtab === 'stats') {
    const s = M.stats;
    if (!s || !s.teams) { b.innerHTML = '<div class="empty panel">Статистика появится после начала матча.</div>'; return; }
    const H = s.teams.home, A = s.teams.away;
    const bar = (n, h, a) => {
      const t = (+h + +a) || 1;
      return `<div class="bar2"><div class="v">${h}</div><div><div class="c">${n}</div><div class="bb"><i style="width:${h / t * 100}%"></i><i style="width:${a / t * 100}%"></i></div></div><div class="v">${a}</div></div>`;
    };
    const pl = Object.values(s.players).sort((a, b) => b.min - a.min);
    b.innerHTML = `<div class="panel">
      ${bar('Владение, %', s.poss[0], s.poss[1])}
      ${bar('Удары', H.sh, A.sh)}
      ${bar('В створ', H.sot, A.sot)}
      ${bar('xG', H.xg, A.xg)}
      ${bar('Угловые', H.co, A.co)}
      ${bar('Фолы', H.fo, A.fo)}
      ${bar('Отборы', H.tk, A.tk)}
      ${bar('Сейвы', H.sv, A.sv)}
      ${bar('Офсайды', H.off, A.off)}
      ${bar('Жёлтые', H.yc, A.yc)}
      ${bar('Красные', H.rc, A.rc)}
      ${bar('Пенальти', H.penF, A.penF)}
    </div>
    <div class="panel wrap"><table><thead><tr><th class="l">Игрок</th><th>Оценка</th><th>Мин</th><th>Г</th><th>П</th><th>Уд</th><th>xG</th><th>Отб</th><th>Сейвы</th><th>Фолы</th><th>ЖК</th><th>КК</th></tr></thead><tbody>${pl.map(p => {
      const rat = M.ratings?.[p.id]?.rating || p.rating || (p.min > 0 ? '6.5' : '—');
      const isMotm = M.motm?.player?.id === p.id || M.motm?.player?.name === p.n || M.motm?.name === p.n;
      const ratColor = +rat >= 8.0 ? 'background:#ffd700;color:#3f2e00' : (+rat >= 7.0 ? 'background:#e3f4e8;color:#0d5929' : (+rat < 6.0 ? 'background:#ffebee;color:#b71c1c' : 'background:var(--soft)'));

        try {
          const res = await api('/admin/fixture', {

            gameDate: gd,
            gameTime: gt,
            realDate: rd,
            realTime: rt,
            stadium: stad,

          f.gameTime = gt;
          f.date = gd;
          f.time = gt;
          f.realDate = rd;
          f.realTime = rt;
          f.stadium = stad;
          f.neutralField = neut;
          if (S.st?.fixtures) {
            const mSt = S.st.fixtures.find(x => x.id === f.id);
            if (mSt) Object.assign(mSt, { gameDate: gd, gameTime: gt, date: gd, time: gt, realDate: rd, realTime: rt, stadium: stad, neutralField: neut });
          }
          toast('Дата и время матча успешно сохранены!');
          drawMatch(app, id);
        } catch (x) {
          toast('Ошибка: ' + (x.message || x));
        }
      };
    }

      }
    };
  }
}

/* ───── тактическое футбольное поле для сборных ───── */
function renderSoccerPitch11(players, coach) {
  if (!players || !players.length) {
    return '<div class="empty panel">Символическая сборная формируется после сыгранных матчей.</div>';
  }

  const gkList = players.filter(p => ['ВР', 'GK'].includes(p.pos));
  const defList = players.filter(p => ['ЦЗ', 'ЛЗ', 'ПЗ', 'DEF', 'CB', 'LB', 'RB'].includes(p.pos));
  const midList = players.filter(p => ['ОП', 'ЦП', 'АП', 'MID', 'DM', 'CM', 'AM'].includes(p.pos));
  const fwdList = players.filter(p => ['ЛВ', 'ПВ', 'ЦФ', 'НАП', 'FWD', 'ST', 'LW', 'RW'].includes(p.pos));

  const remaining = players.filter(p => !gkList.includes(p) && !defList.includes(p) && !midList.includes(p) && !fwdList.includes(p));
  while (gkList.length < 1 && remaining.length) gkList.push(remaining.shift());
  while (defList.length < 4 && remaining.length) defList.push(remaining.shift());
  while (midList.length < 3 && remaining.length) midList.push(remaining.shift());
  while (fwdList.length < 3 && remaining.length) fwdList.push(remaining.shift());

  const pCard = p => {
    if (!p) return '<div class="pitch-player" style="visibility:hidden"></div>';
    const tLogo = p.teamLogo || teamLogo(p.team);
    const rat = p.rating ? (+p.rating).toFixed(1) : (p.avgRating ? (+p.avgRating).toFixed(1) : '7.5');
    const statText = p.stat || (p.g ? `${p.g}Г ${p.a || 0}П` : (p.sv ? `${p.sv} сейвов` : (p.tk ? `${p.tk} отб.` : '')));
    return `
    <div class="pitch-player">
      <div class="pitch-player-avatar">
        ${tLogo ? `<img src="${tLogo}" alt=""/>` : '⚽'}
        <div class="pitch-player-rating">${rat}</div>
      </div>
      <div class="pitch-player-name">${e(p.n || p.name)}</div>
      <div class="pitch-player-team">${e(p.team)} · ${e(p.pos)}</div>
      ${statText ? `<div class="pitch-player-stat">${e(statText)}</div>` : ''}
    </div>`;
  };

  return `
  ${coach ? `
  <div class="panel" style="display:flex;align-items:center;gap:14px;background:var(--soft);border-left:4px solid var(--green2);margin-bottom:12px">
    <div style="font-size:32px">👔</div>
    <div style="flex:1">
      <div class="row" style="gap:6px;margin-bottom:2px">
        <span class="tag" style="background:#ffd700;color:#453300;font-weight:700">${e(coach.title || 'Тренер сборной')}</span>
        <span class="tag">${e(coach.teamName)}</span>
      </div>
      <h3 style="margin:0">${e(coach.coach?.name || coach.name)}</h3>
      <div class="small muted">${e(coach.coach?.styleTitle || coach.style || '')} · <i>${e(coach.reason || coach.coach?.quote || '')}</i></div>
    </div>
  </div>` : ''}
  <div class="pitch-container">
    <div class="pitch-center-circle"></div>
    <div class="pitch-center-line"></div>
    <div class="pitch-penalty-top"></div>
    <div class="pitch-penalty-bottom"></div>
    <!-- 3 НАПАДАЮЩИХ (FWD) -->
    <div class="pitch-row">
      ${(fwdList.slice(0, 3).length ? fwdList.slice(0, 3) : [null, null, null]).map(pCard).join('')}
    </div>
    <!-- 3 ПОЛУЗАЩИТНИКА (MID) -->
    <div class="pitch-row">
      ${(midList.slice(0, 3).length ? midList.slice(0, 3) : [null, null, null]).map(pCard).join('')}
    </div>
    <!-- 4 ЗАЩИТНИКА (DEF) -->
    <div class="pitch-row">
      ${(defList.slice(0, 4).length ? defList.slice(0, 4) : [null, null, null, null]).map(pCard).join('')}
    </div>
    <!-- 1 ВРАТАРЬ (GK) -->
    <div class="pitch-row">
      ${pCard(gkList[0] || players[0])}
    </div>
  </div>`;
}

  app.querySelectorAll('[data-ltab]').forEach(b => b.onclick = () => { LD.tab = b.dataset.ltab; pgLeaders(app); });
  app.querySelectorAll('[data-sel-round]').forEach(b => b.onclick = () => { LD.round = b.dataset.selRound; pgLeaders(app); });

  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { LD.sort = b.dataset.s; pgLeaders(app); });

function setupEuropeanTransferHandlers(app, refreshFn) {
  const withT = o => S.me?.role === 'admin' ? { ...o, teamId: CLUB_TID } : o;
  const tabSingle = $('#tr_tab_single');
  const tabBatch = $('#tr_tab_batch');
  const wrapSingle = $('#tr_single_wrap');
  const wrapBatch = $('#tr_batch_wrap');

  if (tabSingle && tabBatch && wrapSingle && wrapBatch) {
    tabSingle.onclick = () => {
      tabSingle.className = 'btn sm on';
      tabBatch.className = 'btn sm alt';
      wrapSingle.style.display = 'block';
      wrapBatch.style.display = 'none';
    };
    tabBatch.onclick = () => {
      tabSingle.className = 'btn sm alt';
      tabBatch.className = 'btn sm on';
      wrapSingle.style.display = 'none';
      wrapBatch.style.display = 'block';
    };
  }

  const trTypeSel = $('#tr_type');
  const trMandChk = $('#tr_mandatory_rpl');
  const trCondWrap = $('#tr_condition_wrap');
  if (trTypeSel) {
    trTypeSel.onchange = () => {
      if (trTypeSel.value === 'loan_mandatory_rpl') {
        if (trMandChk) trMandChk.checked = true;
        if (trCondWrap) trCondWrap.style.display = 'block';
      } else {
        if (trCondWrap) trCondWrap.style.display = trMandChk?.checked ? 'block' : 'none';
      }
    };
  }
  if (trMandChk && trCondWrap) {
    trMandChk.onchange = () => {
      trCondWrap.style.display = trMandChk.checked ? 'block' : 'none';
      if (trMandChk.checked && trTypeSel && trTypeSel.value === 'transfer') {
        trTypeSel.value = 'loan_mandatory_rpl';
      }
    };
  }

  api('/club/transfer-requests').then(r => {
    const box = $('#tr_list');
    if (!box) return;
    if (!r?.requests?.length) {
      box.innerHTML = '<div class="muted small">Заявок на трансферы из Европы пока нет.</div>';
      return;
    }
    box.innerHTML = `
      <div class="small muted" style="font-weight:700;margin-bottom:8px;color:#334155">Ваши поданные заявки на трансферы из Европы (${r.requests.length}):</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${r.requests.map(x => {
          const statusBadge = x.status === 'approved'
            ? '<span class="tag" style="background:#dcfce7;color:#166534;font-weight:700">✅ Одобрено (в составе)</span>'
            : x.status === 'rejected'
            ? '<span class="tag" style="background:#fee2e2;color:#991b1b;font-weight:700">❌ Отклонено</span>'
            : '<span class="tag" style="background:#fef3c7;color:#92400e;font-weight:700">⏳ На рассмотрении админа</span>';

          const isMand = !!(x.mandatoryBuyoutOnRplRetention || x.mandatoryBuyout || x.transferType === 'loan_mandatory_rpl');
          const typeLabel = isMand
            ? '🛡️ Аренда с обязательным выкупом'
            : x.transferType === 'loan' ? '🔄 Аренда' : '📦 Покупка';

          return `
            <div class="row sp" style="padding:8px 12px;background:#fff;border-radius:6px;border:1px solid #e2e8f0;flex-wrap:wrap;gap:8px;align-items:center">
              <div>
                <div class="row" style="gap:6px;align-items:center;flex-wrap:wrap">
                  <b style="font-size:14px;color:#0f172a">${e(x.playerName)}</b>
                  <span class="tag sm">${e(x.pos || 'Игрок')}</span>
                  <span class="muted small">${x.age ? x.age + ' лет' : ''}${x.nationality ? ' · ' + e(x.nationality) : ''}</span>
                  <span class="muted small">из европейского клуба <b>${e(x.fromClub || 'Европа')}</b></span>
                </div>
                <div class="small muted" style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                  <span>Условия: <b>${e(x.fee)}</b> · ${typeLabel}</span>
                  ${x.buyoutFee && isMand ? `<span class="tag sm" style="background:#ecfdf5;color:#047857;font-weight:600">Выкуп: ${e(x.buyoutFee)} (${e(x.loanCondition || 'при сохранении в РПЛ')})</span>` : ''}
                  ${x.sellOnPercent ? `<span class="tag sm" style="background:#fef3c7;color:#92400e;font-weight:700">🏷️ Sell-on: ${x.sellOnPercent}%</span>` : ''}
                  ${x.marketValue ? `<span>· Рыночная стоимость: ${e(x.marketValue)}</span>` : ''}
                </div>
              </div>
              <div>${statusBadge}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }).catch(() => {});

  const btnSend = $('#tr_send');
  if (btnSend) {
    btnSend.onclick = async () => {
      const pName = $('#tr_name')?.value?.trim();
      const feeVal = $('#tr_fee')?.value?.trim() || '€10.0M';
      const trType = $('#tr_type')?.value || 'transfer';
      const isMand = $('#tr_mandatory_rpl')?.checked || trType === 'loan_mandatory_rpl';
      const buyoutFeeVal = isMand ? ($('#tr_buyout_fee')?.value?.trim() || feeVal) : undefined;
      const loanCondVal = isMand ? ($('#tr_condition')?.value?.trim() || 'Сохранение прописки в РПЛ') : undefined;
      let sellOnVal = Number($('#tr_sell_on')?.value || 0);
      if (sellOnVal > 90) {
        toast('Максимальный процент перепродажи — 90%');
        sellOnVal = 90;
        $('#tr_sell_on').value = 90;
      }
      if (sellOnVal < 0) sellOnVal = 0;

      if (!pName) return toast('Укажите ФИО игрока');
      btnSend.disabled = true;
      btnSend.textContent = 'Нейросеть обрабатывает…';
      const r = await act(() => api('/club/transfer-request', withT({
        playerName: pName,
        fee: feeVal,
        transferType: trType,
        mandatoryBuyout: isMand,
        buyoutFee: buyoutFeeVal,
        loanCondition: loanCondVal,
        sellOnPercent: sellOnVal
      })), 'Заявка отправлена админу на проверку');
      if (r) refreshFn();
      else {
        btnSend.disabled = false;
        btnSend.textContent = 'Отправить заявку админу';
      }
    };
  }

  const btnBatchSend = $('#tr_batch_send');
  if (btnBatchSend) {
    btnBatchSend.onclick = async () => {
      const textVal = $('#tr_batch_text')?.value?.trim();
      if (!textVal) return toast('Введите хотя бы одного игрока в список');
      btnBatchSend.disabled = true;
      btnBatchSend.textContent = 'Нейросеть обрабатывает список игроков…';
      const r = await act(() => api('/club/transfer-request', withT({
        text: textVal
      })), 'Список заявок отправлен админу');
      if (r) refreshFn();
      else {
        btnBatchSend.disabled = false;
        btnBatchSend.textContent = 'Отправить весь список админу 🚀';
      }
    };
  }
}

/* ───────── Статистика команды и игроков (месяц, сезон, всё время) ───────── */
let TEAM_STATS_STATE = {
  period: 'season', // 'month' | 'season' | 'all'
  month: '',
  season: '',
  comp: 'all',
  playerSort: 'g',
  playerSortDir: 'desc',
  playerPos: 'all',
  searchQuery: ''
};

function formatMonthNameRu(mStr) {
  if (!mStr || mStr.length < 7) return mStr || '';
  const [y, m] = mStr.split('-');
  const months = ['', 'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  const num = parseInt(m, 10);
  return `${months[num] || m} ${y}`;
}

async function renderTeamStatsView(container, teamId, opts = {}) {
  const isModal = !!opts.isModal;
  const onClose = opts.onClose;

  container.innerHTML = '<div class="panel" style="text-align:center;padding:36px"><div class="muted">Загрузка статистики команды...</div></div>';

  let data;
  try {
    const q = new URLSearchParams({
      period: TEAM_STATS_STATE.period,
      month: TEAM_STATS_STATE.month,
      season: TEAM_STATS_STATE.season,
      comp: TEAM_STATS_STATE.comp
    });
    data = await api(`/team/${encodeURIComponent(teamId)}/stats?${q.toString()}`);
  } catch (err) {
    container.innerHTML = `<div class="panel warn">Ошибка загрузки статистики: ${e(err.message)}</div>`;
    return;
  }

  const { team, period, activeMonth, activeSeason, activeComp, availableMonths, availableSeasons, availableComps, overview: ov, players, leaders } = data;
  const tLogo = team.logo || teamLogo(team.id);

  // Filter players
  let filteredPlayers = (players || []).filter(p => {
    if (TEAM_STATS_STATE.searchQuery) {
      const q = TEAM_STATS_STATE.searchQuery.toLowerCase();
      if (!p.name.toLowerCase().includes(q) && !(p.number && String(p.number).includes(q))) return false;
    }
    if (TEAM_STATS_STATE.playerPos !== 'all') {
      const pos = p.pos;
      if (TEAM_STATS_STATE.playerPos === 'gk' && pos !== 'ВР') return false;
      if (TEAM_STATS_STATE.playerPos === 'def' && !['ЦЗ', 'ЛЗ', 'ПЗ'].includes(pos)) return false;
      if (TEAM_STATS_STATE.playerPos === 'mid' && !['ОП', 'ЦП', 'АП'].includes(pos)) return false;
      if (TEAM_STATS_STATE.playerPos === 'fwd' && !['ЛВ', 'ПВ', 'ЦФ', 'НАП'].includes(pos)) return false;
    }
    return true;
  });

  // Sort players
  const sKey = TEAM_STATS_STATE.playerSort || 'g';
  const sDir = TEAM_STATS_STATE.playerSortDir === 'asc' ? 1 : -1;
  filteredPlayers.sort((a, b) => {
    let va = a[sKey] ?? 0;
    let vb = b[sKey] ?? 0;
    if (typeof va === 'string') return sDir * va.localeCompare(vb);
    if (va === vb) return (b.min || 0) - (a.min || 0);
    return sDir * (va - vb);
  });

  const periodLabel = period === 'month'
    ? `За месяц: ${formatMonthNameRu(activeMonth)}`
    : period === 'season'
    ? `За сезон: ${activeSeason}`
    : 'За всё время (вся история)';

  container.innerHTML = `
    <div class="team-stats-wrapper">
      <div class="ts-hero-bar">
        <div class="ts-hero-title">
          ${tLogo ? `<img class="ts-hero-logo" src="${tLogo}" alt="${e(team.name)}"/>` : ''}
          <div>
            <div class="row" style="gap:6px;margin-bottom:3px;align-items:center;flex-wrap:wrap">
              <span class="tag" style="font-weight:700">${e(compName(team.comp))}</span>
              ${team.city ? `<span class="tag sm">${e(team.city)}</span>` : ''}
              ${team.stadium ? `<span class="tag sm">🏟 ${e(team.stadium)}</span>` : ''}
              <span class="tag sm" style="background:#f0fdf4;color:#166534;font-weight:700">${periodLabel}</span>
            </div>
            <h2 style="margin:0;font-size:22px">${e(team.name)} · Статистика</h2>
            <div class="muted small" style="margin-top:2px">
              Главный тренер: <b>${e(team.coach?.name || 'Не назначен')}</b>
              ${team.budget ? ` · Бюджет: <b>€${(team.budget).toLocaleString('ru-RU')}</b>` : ''}
            </div>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="ts-period-group">
            <button class="ts-period-btn ${period === 'month' ? 'on' : ''}" data-ts-set-period="month">📅 Месяц</button>
            <button class="ts-period-btn ${period === 'season' ? 'on' : ''}" data-ts-set-period="season">🏆 Сезон</button>
            <button class="ts-period-btn ${period === 'all' ? 'on' : ''}" data-ts-set-period="all">♾️ Всё время</button>
          </div>
          ${isModal ? `<button class="btn alt sm" id="ts_close_modal_btn" style="padding:6px 12px;font-size:14px">✕ Закрыть</button>` : ''}
        </div>
      </div>

      <!-- Фильтры периода и турнира -->

  const seasonSel = container.querySelector('#ts_season_select');

      renderTeamStatsView(container, teamId, opts);

  const compSel = container.querySelector('#ts_comp_select');

      renderTeamStatsView(container, teamId, opts);

      if (TEAM_STATS_STATE.playerSort === col) {

function showTeamStatsModal(teamId) {
  const m = modal(`
    <div class="ts-modal-box" id="team_stats_modal_inner"></div>
  `);
  const inner = m.querySelector('#team_stats_modal_inner');
  renderTeamStatsView(inner, teamId, {
    isModal: true,
    onClose: () => m.remove()
  });
}

async function pgTeamStats(app, teamId) {
  if (!teamId) {
    const defaultTeam = (S.st?.teams || []).find(t => t.comp === 'rpl') || (S.st?.teams || [])[0];
    teamId = defaultTeam?.id || '';
  }
  if (!teamId) {
    app.innerHTML = '<div class="panel warn">Команда не выбрана</div>';
    return;
  }
  app.innerHTML = '<div id="ts_page_root"></div>';
  renderTeamStatsView($('#ts_page_root'), teamId, { isModal: false });
}

let CT = 'matches', CLUB_TID = '';
async function pgClub(app) {
  if (!S.me) return location.hash = '#/login';
  if (S.me.role === 'club') {
    CLUB_TID = S.me.teamId || '';
    if (CLUB_TID) {
      try { localStorage.setItem('rpl_club_tid', CLUB_TID); } catch (e) {}
    }
  } else if (S.me.role === 'admin' && !CLUB_TID) {
    const t = (S.st?.teams || []).filter(t => t.comp === 'rpl');
    CLUB_TID = t[0]?.id || '';
  }
  const q = S.me.role === 'admin' ? '?teamId=' + CLUB_TID : '';
  let c;
  try {
    c = await api('/club' + q);
  } catch (x) {
    app.innerHTML = `<div class="panel warn">${e(x.message)}</div>`;
    return;
  }
  if (S.me.role === 'club' && c?.team?.id) {
    S.me.teamId = c.team.id;
    S.me.teamName = c.team.name;
    CLUB_TID = c.team.id;
    try { localStorage.setItem('rpl_club_tid', c.team.id); } catch (e) {}
    drawChrome();
  }
  const withT = o => S.me.role === 'admin' ? { ...o, teamId: CLUB_TID } : o;
  const isAdmin = S.me?.role === 'admin';
  const logo = c.team.logo || teamLogo(c.team.id);

  ${c.team.coach ? `

          ${isAdmin ? `<span class="tag" style="background:#fef3c7;color:#92400e;border-color:#fde68a">Стиль: ${e(c.team.coach.styleTitle)}</span>` : ''}

      if (!id) return;
      $('#pl').hidden = true;
      const r = await act(() => api('/club/squad/add', withT({ playerId: id })));
      if (r) { r.pending ? toast(r.message) : toast('Игрок добавлен'); pgClub(app); }

        <div class="small muted">${e(x.desc)}</div>
